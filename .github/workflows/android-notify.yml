name: Android notify app

on:
  push:
    branches: [firmware-v0.7.1]
    paths: ['android/**', '.github/workflows/android-notify.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Collect
        run: cp android/app/build/outputs/apk/debug/app-debug.apk fishwatch-notify.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fishwatch-notify
          path: fishwatch-notify.apk
      - name: Publish to the notify-app release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view notify-app >/dev/null 2>&1; then
            gh release create notify-app --target "$GITHUB_SHA" --title "FishWatch 通知 App" \
              --notes "安装 fishwatch-notify.apk（要允许安装未知来源的应用）。手表要刷 0.8.0 以上，并在手表「通知」里打开「收通知」。"
          fi
          gh release upload notify-app fishwatch-notify.apk --clobber
